<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Dropdown click-capture diagnostic</title>
<style>
  body { font-family: sans-serif; padding: 24px; }
  #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; margin-top: 16px; min-height: 200px; font-size: 13px; }
  button { font-size: 16px; padding: 8px 12px; }
  [role="menu"] { background: white; border: 1px solid #ccc; padding: 4px; position: absolute; }
  [role="menuitem"] { padding: 8px 12px; cursor: pointer; }
  [role="menuitem"]:hover { background: #eee; }
</style>
</head>
<body>
<div id="root"></div>
<div id="log"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.3",
    "react/": "https://esm.sh/react@19.2.3/",
    "react-dom": "https://esm.sh/react-dom@19.2.3",
    "react-dom/": "https://esm.sh/react-dom@19.2.3/",
    "@radix-ui/react-dropdown-menu": "https://esm.sh/@radix-ui/react-dropdown-menu@2.1.16?external=react,react-dom"
  }
}
</script>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import * as DropdownMenu from "@radix-ui/react-dropdown-menu";

const logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent += msg + "\n";
}

// Exact same selector + capture-phase listener approach as SoundFxInit
const INTERACTIVE_SELECTOR = [
  "button","a","[role='button']","[role='menuitem']","[role='menuitemcheckbox']",
  "[role='menuitemradio']","[role='option']","[role='tab']","[role='switch']",
  "[role='checkbox']","[role='radio']","input[type='button']","input[type='submit']",
  "input[type='checkbox']","input[type='radio']","select","summary",
].join(", ");

document.addEventListener("click", (event) => {
  const target = event.target;
  const matchClosest = target && target.closest ? target.closest(INTERACTIVE_SELECTOR) : null;
  log(`[capture] click target=<${target.tagName.toLowerCase()} role=${target.getAttribute && target.getAttribute("role")}> matchedInteractive=${!!matchClosest} matchedTag=${matchClosest ? matchClosest.tagName + " role=" + matchClosest.getAttribute("role") : "none"}`);
}, true);

function App() {
  return React.createElement(DropdownMenu.Root, null,
    React.createElement(DropdownMenu.Trigger, { asChild: true },
      React.createElement("button", null, "3-dot trigger")
    ),
    React.createElement(DropdownMenu.Portal, null,
      React.createElement(DropdownMenu.Content, { align: "end" },
        React.createElement(DropdownMenu.Item, { onSelect: () => log(">>> onSelect fired: Screenshot") }, "Screenshot"),
        React.createElement(DropdownMenu.Item, { onSelect: () => log(">>> onSelect fired: Report") }, "Report screenshot")
      )
    )
  );
}

createRoot(document.getElementById("root")).render(React.createElement(App));
log("Ready. Click the trigger, then click a menu item.");
</script>
</body>
</html>
