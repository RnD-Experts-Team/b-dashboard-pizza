related_architecture:
  components_relevant_to_domain:
    - component: AppShell
      responsibility: "Main dashboard shell (sidebar nav + content area)"
      location: components/layout/app-shell.tsx
      relationship_to_domain: "Parent wrapper - scheduling page renders inside this"
    - component: PageHeader
      responsibility: "Consistent page title/description/actions bar"
      location: components/layout/page-header.tsx
      relationship_to_domain: "Used at top of scheduling page"
    - component: useAuthStore
      responsibility: "Authentication state management via zustand"
      location: lib/auth/auth.store.ts
      relationship_to_domain: "Dashboard layout checks auth before rendering scheduling"
  interfaces_used_by_domain:
    - interface: ScheduleEmployee
      location: types/scheduling.types.ts
      usage_pattern: "Used for employee data in sidebar, grid, dialogs"
    - interface: Shift
      location: types/scheduling.types.ts
      usage_pattern: "Core data model for all shift CRUD operations"
    - interface: PublishedSchedule
      location: types/scheduling.types.ts
      usage_pattern: "Stores published schedule screenshots with shift data"
  data_flow_involving_domain: |
    SchedulingManager holds all state (shifts, publishedSchedules, weekOffset, dialog state).
    EmployeeSidebar -> drag event -> ScheduleGrid -> onDropEmployee -> opens AddShiftDialog.
    AddShiftDialog -> onConfirm -> creates/updates Shift in SchedulingManager state.
    Publish flow: captures grid screenshot via html2canvas-pro -> stores as PublishedSchedule.
    All data is ephemeral client-side state (no persistence/API calls).
  key_relationships_to_domain:
    - from: page.tsx
      to: SchedulingManager
      relationship: renders
    - from: SchedulingManager
      to: EmployeeSidebar
      relationship: composes
    - from: SchedulingManager
      to: ScheduleGrid
      relationship: composes
    - from: SchedulingManager
      to: AddShiftDialog
      relationship: composes
    - from: SchedulingManager
      to: PublishedSchedules
      relationship: composes
    - from: EmployeeSidebar
      to: EmployeeDetailsDialog
      relationship: composes
    - from: all components
      to: lib/scheduling/data.ts
      relationship: imports constants and utilities
    - from: all components
      to: types/scheduling.types.ts
      relationship: imports type definitions

