plan_id: scheduling-weekly
objective: Gather all context needed to build a new weekly employee scheduling page
focus_area: scheduling
created_at: "2026-03-26"
created_by: gem-researcher
status: completed

tldr:
  |
  - Scheduling module is fully client-side with drag-and-drop shift creation on a 7-day grid (Tue-Mon), using mock data for 8 employees across 5 stations.
  - Built with shadcn/ui components (Dialog, Card, Avatar, Badge, Select, ScrollArea, etc.), Tailwind CSS v4 with oklch theme variables, and native HTML5 drag-and-drop (not @dnd-kit).
  - Key libraries available: date-fns v4, @dnd-kit (core+sortable), zustand, zod, react-hook-form, html2canvas-pro, lucide-react, next-intl, next-themes, sonner, apexcharts.
  - Architecture: page.tsx renders SchedulingManager (barrel export), which orchestrates EmployeeSidebar, ScheduleGrid, AddShiftDialog, PublishedSchedules, EmployeeDetailsDialog.
  - Grid uses absolute positioning with percentage-based time layout (9AM-midnight), greedy lane algorithm for overlapping shifts, and dynamic column widths.

research_metadata:
  methodology: "hybrid retrieval: file listing + targeted read_file for all scheduling files, package.json, globals.css, layout, i18n config, UI components directory"
  scope: "Full scheduling module (7 files), types, lib/data, layout, theming, package dependencies, i18n config, UI component inventory"
  confidence: high
  coverage: 95

