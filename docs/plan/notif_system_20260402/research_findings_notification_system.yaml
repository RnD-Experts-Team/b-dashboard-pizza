plan_id: notif_system_20260402
objective: "Add a notification system with bell button beside theme toggle, unread indicator, slide-in toasts, popup panel with read/unread tabs, mark-as-read, announcements placeholder, and test trigger button using mock data"
focus_area: notification_system
created_at: "2026-04-02"
created_by: gem-researcher
status: completed

tldr: |
  - Header lives in components/layout/topbar.tsx; theme toggle rendered at line 97-99 inside a <Feature name="darkMode"> wrapper — notification bell should be placed immediately before this block
  - Project uses shadcn/ui (new-york style) with Tailwind CSS v4, CSS variables, and lucide-react icons; all needed UI primitives (Button, Popover, Badge, Tabs, ScrollArea, Sheet, Skeleton) already exist in components/ui/
  - No framer-motion; animations use tw-animate-css + Tailwind data-state classes; Sonner is already installed for toast notifications
  - State management is Zustand with persist middleware; stores live in lib/store/*.store.ts with barrel export
  - i18n uses next-intl with flat JSON locale files (en.json, ar.json) supporting RTL; translations accessed via useTranslations("namespace")

