    description: "Zustand stores with persist middleware, createJSONStorage, SSR-safe noopStorage fallback"
    examples:
      - file: ui.store.ts
        location: "ui.store.ts:28-53"
        snippet: "create<UIState>()(persist((set) => ({...}), { name: 'ui-storage', storage: createJSONStorage(() => typeof window !== 'undefined' ? localStorage : noopStorage) }))"
    prevalence: common

