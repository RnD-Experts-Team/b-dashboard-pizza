plan_id: notif_system_20260402
objective: |
  Add a notification system to the dashboard with: bell button beside theme toggle in topbar,
  unread indicator (red badge with count), slide-in toast notifications from the side when new
  notifications arrive, popup panel (Popover) on bell click with All/Unread tabs and mark-as-read,
  announcements section placeholder, click-on-toast opens popup or dismiss by drag/close, mock data,
  and a test trigger button beside the bell.
created_at: "2026-04-02"
created_by: gem-planner
status: pending_approval
research_confidence: high

plan_metrics:
  wave_1_task_count: 2
  total_dependencies: 8
  risk_score: low

tldr: |
  7 tasks across 5 waves to build a notification system with mock data:
  Wave 1 creates types + Zustand store (parallel). Wave 2 builds NotificationItem + NotificationToast
  components (parallel). Wave 3 assembles the NotificationPanel popup. Wave 4 creates the NotificationBell
  button with unread badge. Wave 5 integrates everything into the topbar with a test trigger button.
  All components use shadcn/ui primitives, Sonner for toasts, Zustand for state, and follow existing
  project conventions (naming, i18n, Feature flags, "use client" directive).

open_questions:
  - "Should the notification panel use Popover (desktop) + Sheet (mobile) or Popover only? Plan assumes Popover-only for simplicity; can extend later."
  - "Should a 'notifications' feature flag be registered? Plan includes it as part of topbar integration task."
  - "Is <Toaster /> already mounted in the root layout? If not, wave 5 task must add it."

pre_mortem:
  overall_risk_level: low
  critical_failure_modes:
    - scenario: "Sonner Toaster not mounted in root layout — slide-in toasts won't appear"
      likelihood: medium
      impact: medium
      mitigation: "Wave 5 integration task verifies Toaster is in app layout; if missing, adds it"
    - scenario: "Popover z-index conflict with sidebar Sheet or other overlays"
      likelihood: low
      impact: medium
      mitigation: "Use explicit z-50 on Popover content; test with sidebar open"
    - scenario: "Zustand persist rehydration causes flash of wrong unread count on SSR"
      likelihood: low
      impact: low
      mitigation: "Use noopStorage SSR fallback pattern from ui.store.ts; mount badge client-side only"
  assumptions:
    - "All shadcn/ui primitives (Popover, Tabs, Badge, ScrollArea, Button, Separator) are already installed"
    - "Sonner is installed and its Toaster component is rendered somewhere in the app layout tree"
    - "Feature flag system supports adding new flags without config changes (or config change is trivial)"
    - "Mock data is sufficient — no backend API integration needed for this phase"
    - "RTL support handled automatically by Tailwind logical properties (ms-, me-, ps-, pe-) already used in codebase"

implementation_specification:
  code_structure: |
    New files organized by domain convention:
    - types/notification.types.ts — type definitions
    - lib/store/notification.store.ts — Zustand store + mock data
    - components/notifications/ — all UI components (notification-item, notification-toast, notification-panel, notification-bell)
    Existing file modified:
    - components/layout/topbar.tsx — import and render NotificationBell + test trigger button
    - lib/store/index.ts — barrel export for notification store
  affected_areas:
    - types/ (new file)
    - lib/store/ (new file + barrel update)
    - components/notifications/ (new directory with 4 files)
    - components/layout/topbar.tsx (modification)
  component_details:
    - component: NotificationTypes
      responsibility: "Define Notification, NotificationType, NotificationPriority, and NotificationStore interfaces"
      interfaces:
        - "Notification — id, type, title, message, timestamp, read, priority, actionUrl?"
        - "NotificationType — 'info' | 'warning' | 'success' | 'error' | 'announcement'"
        - "NotificationPriority — 'low' | 'medium' | 'high'"
        - "NotificationState — notifications[], unreadCount, computed getters"
        - "NotificationActions — addNotification, markAsRead, markAllAsRead, removeNotification, clearAll"
    - component: NotificationStore
      responsibility: "Zustand store managing notification state with persist middleware, mock data seeder, and derived unread count"
      interfaces:
        - "useNotificationStore() — hook returning state + actions"
        - "MOCK_NOTIFICATIONS — seed data array"
    - component: NotificationItem
      responsibility: "Single notification row with icon, title, message snippet, timestamp, read/unread styling, and mark-as-read button"
      interfaces:
        - "NotificationItemProps — { notification: Notification, onMarkAsRead: (id) => void, onClick?: (id) => void }"
    - component: NotificationToast
      responsibility: "Slide-in toast wrapper using Sonner custom toast; shows notification title + keyword snippet; click opens panel, swipe/close dismisses"
      interfaces:
        - "showNotificationToast(notification: Notification) — function triggering Sonner custom toast"
    - component: NotificationPanel
      responsibility: "Popover content with Tabs (All / Unread), ScrollArea list of NotificationItems, mark-all-as-read button, announcements placeholder section"
      interfaces:
        - "NotificationPanelProps — { notifications: Notification[], onMarkAsRead, onMarkAllAsRead }"
    - component: NotificationBell
      responsibility: "Bell icon button with unread badge count, Popover trigger, renders NotificationPanel as Popover content"
      interfaces:
        - "<NotificationBell /> — self-contained component reading from useNotificationStore"
  dependencies:
    - component: NotificationStore
      relationship: "imports types from NotificationTypes"
    - component: NotificationItem
      relationship: "imports Notification type; used by NotificationPanel"
    - component: NotificationToast
      relationship: "imports Notification type and useNotificationStore; uses Sonner toast()"
    - component: NotificationPanel
      relationship: "composes NotificationItem; imports types and store"
    - component: NotificationBell
      relationship: "composes NotificationPanel via Popover; imports store for unread count; triggers NotificationToast"
    - component: Topbar
      relationship: "imports and renders NotificationBell + test trigger button"
  integration_points:
    - "Topbar — NotificationBell inserted before <Feature name='darkMode'> block (line ~97)"
    - "lib/store/index.ts — add barrel export for useNotificationStore"
    - "Sonner Toaster — verify mounted in root layout for toast support"

