  - id: task_2_store
    title: "Create notification Zustand store with mock data"
    description: |
      Create lib/store/notification.store.ts following the Zustand persist pattern from ui.store.ts:
      - Import types from types/notification.types.ts
      - Define MOCK_NOTIFICATIONS array (5-8 varied notifications with different types, priorities,
        read/unread states, realistic timestamps)
      - Create useNotificationStore with persist middleware:
        - State: notifications (initialized with MOCK_NOTIFICATIONS), unreadCount (computed on init and after mutations)
        - Actions: addNotification (prepend + update count), markAsRead(id), markAllAsRead,
          removeNotification(id), clearAll
        - Persist config: name 'notification-storage', SSR-safe noopStorage fallback
      - Update unreadCount on every mutation that changes read state
      - Add barrel export to lib/store/index.ts

      Follow exact patterns from ui.store.ts:
      - noopStorage for SSR safety
      - createJSONStorage(() => typeof window !== 'undefined' ? localStorage : noopStorage)
    wave: 1
    agent: gem-implementer
    priority: high
    status: pending
    dependencies: []
    context_files:
