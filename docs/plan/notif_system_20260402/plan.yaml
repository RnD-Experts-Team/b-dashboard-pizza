      - NotificationType union: 'info' | 'warning' | 'success' | 'error' | 'announcement'
      - NotificationPriority union: 'low' | 'medium' | 'high'
      - Notification interface: id (string), type (NotificationType), title (string),
        message (string), timestamp (Date | string), read (boolean), priority (NotificationPriority),
        actionUrl (optional string)
      - NotificationState interface: notifications array, unreadCount number
      - NotificationActions interface: addNotification, markAsRead(id), markAllAsRead,
        removeNotification(id), clearAll

      Follow conventions:
      - JSDoc section headers (see types/store.types.ts pattern)
      - Export all types
      - Barrel re-export from types/index.ts
    wave: 1
    agent: gem-implementer
    priority: high
    status: pending
    dependencies: []
    context_files:
      - types/store.types.ts: "Reference for JSDoc section headers and type file structure"
